<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Summit · C: Flow builder</title>
<link rel="stylesheet" href="shared.css">
<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"></script>
<script src="shared.js"></script>
<style>
  /* layout only: components come from shared.css */
  body { display: grid; grid-template-rows: minmax(0, 1fr) 4px var(--flow-h, 320px) auto; overflow: hidden; }
  #mapwrap { position: relative; min-height: 0; overflow: hidden; }
  #map { position: absolute; inset: 0; }
  #map.dragging-stage { cursor: grabbing; }
  .tl { top: 12px; left: 12px; padding: 7px 12px; display: flex; gap: 12px; align-items: center; }
  .tc { top: 62px; left: 12px; padding: 7px 12px; color: var(--muted); cursor: text; display: flex; gap: 16px; }
  .flowbar { top: 12px; right: 12px; padding: 8px 10px; gap: 8px; flex-wrap: nowrap; }
  .flowbar input[type=range] { width: 90px; }
  .flowbar .pool { color: var(--muted); min-width: 92px; text-shadow: none; }
  .hint { bottom: 12px; left: 50%; transform: translateX(-50%); padding: 6px 14px; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .hint b { color: var(--text); font-weight: 500; }
  .bottom { display: grid; grid-template-rows: auto auto minmax(0, 1fr); min-height: 0; }
  .bhead { display: flex; align-items: center; gap: 14px; padding: 10px 14px 8px; flex-wrap: wrap; }
  .bhead h2 { font-size: 15px; letter-spacing: .12em; text-transform: uppercase; }
  .stages { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; flex: 1; }
  .timeline { margin: 0 14px 8px; }
  .list { overflow: auto; min-height: 0; border-top: 1px solid var(--line); }
  td.idx .badge { width: 18px; height: 18px; }
</style>
</head>
<body>
<div id="mapwrap">
  <div id="map" class="mapbg"></div>
  <div class="float tl"><a class="brand" href="index.html">summit</a>
    <div class="seg" id="space"><button data-v="clap">CLAP</button><button data-v="effnet" class="on">EffNet</button><button data-v="combined">Combined</button></div>
  </div>
  <div class="float tc" id="openPal"><span>Search → add as stage</span><kbd>⌘K</kbd></div>
  <div class="float flowbar toolbar">
    <button class="primary" id="newFlow">＋ New flow</button>
    <button id="undo" title="Undo (⌘Z)">↶</button><button id="redo" title="Redo (⇧⌘Z)">↷</button>
    <span class="sep"></span>
    <label title="How far from the route a track can be to get pulled in">Radius <input type="range" id="radius" min="0.3" max="3" step="0.1"></label><span class="val" id="radiusV"></span>
    <span class="val pool" id="poolV"></span>
    <label title="Target set length">Length <input type="range" id="len" min="30" max="240" step="15"></label><span class="val" id="lenV"></span>
    <button id="shuffle" title="Re-roll which corridor tracks get picked">⤨ Shuffle</button>
    <span class="sep"></span>
    <button id="save">Save playlist</button>
  </div>
  <div class="float hint help" id="hint"></div>
</div>
<div class="split-y" id="splitFlow"></div>
<section class="bottom surface" id="bottom">
  <div class="bhead" id="bhead"></div>
  <div class="timeline" id="timeline"></div>
  <div class="list" id="list"></div>
</section>
<footer id="player"></footer>
<div class="palette" id="pal"><div class="box"><input id="pq" placeholder="artist, title, or a vibe like “sunrise euphoric”…"><div class="res" id="pres"></div></div></div>

<script>
// A flow = ordered stage anchors (tracks) + a corridor radius + a target length.
// Tracks inside the corridor around the route form the pool; picks are spread evenly along the route.
// (Real version: same idea in full embedding space, radius in cosine distance.)
const st = { space: 'effnet', flow: { stages: [], radius: 1.0, length: 90, excluded: [], seed: 1 }, sel: null, res: null };
const undoStack = [], redoStack = [];
const map = document.getElementById('map');
const AVG_DUR = S.tracks.reduce((a, t) => a + t.dur, 0) / S.tracks.length;

function edit(label, fn) {
  undoStack.push({ label, flow: JSON.stringify(st.flow) }); redoStack.length = 0;
  fn(st.flow); render();
}
function undo() {
  const u = undoStack.pop(); if (!u) return;
  redoStack.push({ label: u.label, flow: JSON.stringify(st.flow) }); st.flow = JSON.parse(u.flow); st.sel = null; render(); S.toast('Undo: ' + u.label);
}
function redo() {
  const r = redoStack.pop(); if (!r) return;
  undoStack.push({ label: r.label, flow: JSON.stringify(st.flow) }); st.flow = JSON.parse(r.flow); st.sel = null; render(); S.toast('Redo: ' + r.label);
}

// ---- route + picks ----
let drag = null;   // { k, x, y } while dragging a stage
function stagePts() {
  const L = S.layout(st.space);
  return st.flow.stages.map((j, k) => (drag && drag.k === k && drag.x != null ? [drag.x, drag.y] : [L.x[j], L.y[j]]));
}
function compute() {
  const f = st.flow, W = stagePts(), L = S.layout(st.space);
  if (W.length < 2) return { W, pool: [], picks: f.stages.map((j, k) => ({ j, s: 0, anchor: k })) };
  const cum = [0];
  for (let k = 0; k < W.length - 1; k++) cum.push(cum[k] + Math.hypot(W[k + 1][0] - W[k][0], W[k + 1][1] - W[k][1]));
  const total = cum[cum.length - 1] || 1e-9, ex = new Set(f.excluded), anchors = new Set(f.stages), pool = [];
  for (const t of S.tracks) {
    if (ex.has(t.i) || anchors.has(t.i)) continue;
    let best = null;
    for (let k = 0; k < W.length - 1; k++) {
      const [ax, ay] = W[k], dx = W[k + 1][0] - ax, dy = W[k + 1][1] - ay, len2 = dx * dx + dy * dy || 1e-9;
      const u = Math.max(0, Math.min(1, ((L.x[t.i] - ax) * dx + (L.y[t.i] - ay) * dy) / len2));
      const d = Math.hypot(L.x[t.i] - (ax + u * dx), L.y[t.i] - (ay + u * dy));
      if (!best || d < best.d) best = { j: t.i, d, s: cum[k] + u * Math.sqrt(len2) };
    }
    if (best.d <= f.radius) pool.push(best);
  }
  // Each slot draws from anywhere in the corridor (stable shuffle per seed), so a wider radius
  // visibly pulls in tracks further from the route.
  const slots = Math.max(0, Math.round((f.length * 60) / AVG_DUR) - f.stages.length), used = new Set();
  const rnd = j => { let h = (j * 2654435761 + (f.seed || 1) * 40503) >>> 0; h ^= h >>> 15; h = Math.imul(h, 2246822519) >>> 0; return (h ^ (h >>> 13)) >>> 0; };
  const picks = f.stages.map((j, k) => ({ j, s: cum[k], anchor: k }));
  let short = 0;
  for (let q = 0; q < slots; q++) {
    const a = (total * q) / slots, b = (total * (q + 1)) / slots;
    let best = null;
    for (const p of pool) if (p.s >= a && p.s < b && !used.has(p.j) && (!best || rnd(p.j) < rnd(best.j))) best = p;
    if (best) { used.add(best.j); picks.push(best); } else short++;
  }
  picks.sort((a, b) => a.s - b.s || (a.anchor != null ? -1 : 1));
  return { W, pool, picks, cum, short };
}

// ---- drawing ----
// Colour rules: a stage always wears its cluster colour; route + corridor are white (never a cluster colour);
// now-playing is a shape (ring / ▶ / outline), selection is a pink outline.
const stageColor = j => S.PALETTE[S.tracks[j].cluster];
function drawMap() {
  const r = st.res, W = r.W, f = st.flow;
  Plotly.restyle(map, { x: [W.map(p => p[0]), W.map(p => p[0])], y: [W.map(p => p[1]), W.map(p => p[1])], mode: ['lines', 'lines'] }, [2, 3]);
  // Marks beat data (DESIGN.md): stage markers are SVG annotations drawn after the cluster labels, so they always sit
  // on top. Black tile + white numeral + white edge (pink when selected), framed by a ring in the stage's cluster colour.
  const marks = W.flatMap(([x, y], k) => [
    { x, y, text: ' ', showarrow: false, width: 30, height: 30, bgcolor: 'rgba(0,0,0,0)', bordercolor: stageColor(f.stages[k]), borderwidth: 3 },
    { x, y, text: String(k + 1), showarrow: false, width: 20, height: 20, bgcolor: '#000000', bordercolor: k === st.sel ? S.UI.selected : S.UI.focus, borderwidth: 2, borderpad: 1,
      font: { family: 'VT323, monospace', size: 20, color: '#ffffff' } },
  ]);
  // corridor in data units so it scales with zoom
  const shapes = [], rad = f.radius, sty = { fillcolor: 'rgba(255,255,255,.07)', layer: 'below' };
  for (let k = 0; k < W.length - 1; k++) {
    const [x1, y1] = W[k], [x2, y2] = W[k + 1], len = Math.hypot(x2 - x1, y2 - y1) || 1e-9, nx = (-(y2 - y1) / len) * rad, ny = ((x2 - x1) / len) * rad;
    shapes.push({ type: 'path', path: `M${x1 + nx},${y1 + ny} L${x2 + nx},${y2 + ny} L${x2 - nx},${y2 - ny} L${x1 - nx},${y1 - ny} Z`, ...sty, line: { width: 0 } });
  }
  W.forEach(([x, y]) => shapes.push({ type: 'circle', x0: x - rad, x1: x + rad, y0: y - rad, y1: y + rad, ...sty, line: { width: 0 } }));
  Plotly.relayout(map, { shapes, annotations: S.labels(st.space).concat(marks) });
  // Same dot vocabulary as every view: outside the corridor fades, picks get the white highlight ring.
  const op = new Array(S.tracks.length).fill(W.length >= 2 ? S.DOT.fade : 1);
  r.pool.forEach(p => (op[p.j] = 1));
  r.picks.forEach(p => (op[p.j] = 1));
  S.setOpacity(map, op);
  ringPicks();
}
// Rings on picked tracks (stages already have their own marker); a hovered row gets a larger ring.
function ringPicks(hoverJ) {
  const idxs = st.res.picks.filter(p => p.anchor == null).map(p => p.j);
  if (hoverJ != null) idxs.push(hoverJ);
  S.highlight(map, idxs, st.space);
  Plotly.restyle(map, { 'marker.size': [idxs.map((j, k) => (hoverJ != null && k === idxs.length - 1 ? 20 : 12))] }, [1]);
}

function render() {
  st.res = compute();
  if (st.sel != null && st.sel >= st.flow.stages.length) st.sel = null;
  drawMap(); renderBottom(); renderBar();
}

function renderBar() {
  document.getElementById('radius').value = st.flow.radius; document.getElementById('radiusV').textContent = st.flow.radius.toFixed(1);
  document.getElementById('len').value = st.flow.length; document.getElementById('lenV').textContent = S.fmtDur(st.flow.length * 60).replace(/:00$/, '') + (st.flow.length >= 60 ? 'h' : 'm');
  document.getElementById('undo').disabled = !undoStack.length; document.getElementById('undo').title = undoStack.length ? `Undo ${undoStack[undoStack.length - 1].label} (⌘Z)` : 'Nothing to undo';
  document.getElementById('redo').disabled = !redoStack.length;
  document.getElementById('poolV').textContent = st.flow.stages.length > 1 ? `${st.res.pool.length} in corridor` : '';
  document.getElementById('shuffle').disabled = st.flow.stages.length < 2;
  const n = st.flow.stages.length;
  document.getElementById('hint').innerHTML = n === 0 ? '<b>Click the map</b> to place the first stage'
    : n === 1 ? '<b>Click again</b> to place the next stage. The route connects them in order.'
    : '<b>Click</b> to add a stage · <b>click the route</b> to insert · <b>drag</b> a stage to move · select + <kbd>⌫</kbd> deletes · <kbd>⌘Z</kbd> undo';
}

function renderBottom() {
  const { picks } = st.res, f = st.flow, cur = S.player.current;
  const total = picks.reduce((a, p) => a + S.tracks[p.j].dur, 0);
  const stageName = j => S.CLUSTERS[S.tracks[j].cluster].name;
  document.getElementById('bhead').innerHTML = `
    <h2>Flow</h2>
    <span class="stats"><b>${picks.length}</b> tracks · <b>${S.fmtDur(total)}</b> · <b>${f.stages.length}</b> stages${f.stages.length > 1 ? ` · picked from <b>${st.res.pool.length}</b> in corridor` : ''}${st.res.short ? ` <span class="warn">· ${st.res.short} short of target: widen radius</span>` : ''}</span>
    <div class="stages">${f.stages.map((j, k) => `${k ? '<span class="arrow">→</span>' : ''}<span class="stage ${k === st.sel ? 'sel' : ''}" data-stage="${k}" style="--c:${stageColor(j)}"><span class="badge" style="--c:${stageColor(j)}">${k + 1}</span>${S.esc(stageName(j))}<button data-del="${k}" title="Delete stage">×</button></span>`).join('') || '<span class="muted small">No stages yet</span>'}</div>
    <button class="primary" id="playFlow" ${picks.length ? '' : 'disabled'}>▶ Play flow</button>`;

  // timeline: block width ∝ duration, colour = cluster, BPM line on top
  const tl = document.getElementById('timeline');
  if (!picks.length) { tl.innerHTML = '<div class="empty">The set timeline appears here as you place stages</div>'; }
  else {
    let acc = 0; const pts = [];
    const bpms = picks.map(p => S.tracks[p.j].bpm), lo = Math.min(...bpms) - 3, hi = Math.max(...bpms) + 3;
    const blocks = picks.map(p => {
      const t = S.tracks[p.j], mid = (acc + t.dur / 2) / total; acc += t.dur;
      pts.push(`${(mid * 1000).toFixed(1)},${(((hi - t.bpm) / (hi - lo)) * 100).toFixed(1)}`);
      return `<div class="blk ${p.anchor != null ? 'anchor' : ''} ${p.j === cur ? 'playing' : ''}" data-i="${p.j}" data-n="${p.anchor != null ? p.anchor + 1 : ''}" style="flex-grow:${t.dur};--c:${S.PALETTE[t.cluster]}" title="${S.esc(t.title)} · ${S.esc(t.artist)} · ${t.bpm} BPM"></div>`;
    }).join('');
    tl.innerHTML = blocks + `<svg viewBox="0 0 1000 100" preserveAspectRatio="none"><polyline points="${pts.join(' ')}" fill="none" stroke="#fff" stroke-width="1.5" vector-effect="non-scaling-stroke" opacity=".9"/></svg>
      <span class="bpmlab" style="top:2px">${hi - 3}</span><span class="bpmlab" style="bottom:2px">${lo + 3} BPM</span>`;
  }

  // list
  let t0 = 0;
  document.getElementById('list').innerHTML = !picks.length ? '<div class="empty">Place two stages on the map to pull in tracks along the route.</div>' : `<table>
    <thead><tr><th></th><th class="bar"></th><th>Start</th><th>Title</th><th>Artist</th><th>BPM</th><th>Key</th><th>Cluster</th><th></th></tr></thead><tbody>
    ${picks.map((p, n) => { const t = S.tracks[p.j], start = t0; t0 += t.dur; return `<tr data-i="${p.j}" class="${p.anchor != null ? 'anchor' : ''} ${p.j === cur ? 'playing' : ''}">
      <td class="idx">${p.anchor != null ? `<span class="badge" style="--c:${S.PALETTE[t.cluster]}">${p.anchor + 1}</span>` : n + 1}</td><td class="bar" style="--c:${S.PALETTE[t.cluster]}"></td>
      <td class="num">${S.fmtDur(start)}</td><td>${S.esc(t.title)}</td><td class="muted">${S.esc(t.artist)}</td>
      <td class="num">${t.bpm}</td><td class="num">${t.key}</td><td class="muted">${S.esc(S.CLUSTERS[t.cluster].name)}</td>
      <td>${p.anchor != null ? '' : `<button class="x" data-x="${p.j}" title="Remove from flow (next best track fills in)">✕</button>`}</td></tr>`; }).join('')}
    </tbody></table>`;
}

// ---- map mouse handling: click adds/inserts, drag moves stages, plain drag elsewhere pans ----
const relPos = e => { const r = map.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
function hitStage(px, py) {
  const W = stagePts();
  for (let k = W.length - 1; k >= 0; k--) { const [sx, sy] = S.toPx(map, ...W[k]); if (Math.max(Math.abs(sx - px), Math.abs(sy - py)) < 17) return k; }
  return -1;
}
function hitSegment(px, py) {
  const W = stagePts().map(p => S.toPx(map, ...p));
  for (let k = 0; k < W.length - 1; k++) {
    const [ax, ay] = W[k], dx = W[k + 1][0] - ax, dy = W[k + 1][1] - ay, len2 = dx * dx + dy * dy || 1;
    const u = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / len2));
    if (Math.hypot(px - (ax + u * dx), py - (ay + u * dy)) < 8) return k;
  }
  return -1;
}
let down = null;
map.addEventListener('mousedown', e => {
  if (e.button !== 0 || e.ctrlKey) return;
  const [px, py] = relPos(e), k = hitStage(px, py);
  down = { px, py, moved: false };
  if (k >= 0) { e.preventDefault(); e.stopPropagation(); drag = { k, x: null, y: null }; map.classList.add('dragging-stage'); }
}, true);
document.addEventListener('mousemove', e => {
  if (!down) return;
  const [px, py] = relPos(e);
  if (Math.hypot(px - down.px, py - down.py) > 4) down.moved = true;
  if (drag && down.moved) {
    [drag.x, drag.y] = S.toData(map, px, py);
    if (!drag.raf) drag.raf = requestAnimationFrame(() => { if (drag) { drag.raf = 0; st.res = compute(); drawMap(); } });
  }
}, true);
document.addEventListener('mouseup', () => {
  if (!down) return;
  const d = down; down = null;
  if (drag) {
    const dr = drag; drag = null; map.classList.remove('dragging-stage');
    if (d.moved && dr.x != null) { const j = S.nearest(dr.x, dr.y, st.space); edit('move stage', f => (f.stages[dr.k] = j)); }
    else { st.sel = st.sel === dr.k ? null : dr.k; render(); }
    return;
  }
  if (d.moved) return;   // that was a pan
  const [x, y] = S.toData(map, d.px, d.py), j = S.nearest(x, y, st.space), seg = hitSegment(d.px, d.py);
  if (seg >= 0) edit('insert stage', f => f.stages.splice(seg + 1, 0, j));
  else edit('add stage', f => f.stages.push(j));
  st.sel = null;
});

// ---- plot ----
S.plot(map, { space: st.space, colorMode: 'cluster', getSpace: () => st.space, config: { doubleClick: false } }).then(() => {
  map.on('plotly_hover', e => { const p = e.points.find(p => p.curveNumber === 0); if (p && e.event && e.event.altKey) S.player.audition(p.pointIndex); });
  render();
  S.splitter(document.getElementById('splitFlow'), { target: document.getElementById('bottom'), cssVar: '--flow-h', axis: 'y', sign: -1, min: 150, max: window.innerHeight - 220, key: 'summit.c.flow', onResize: () => Plotly.Plots.resize(map) });
});

// ---- controls ----
document.getElementById('newFlow').onclick = () => { if (st.flow.stages.length) edit('new flow', f => { f.stages = []; f.excluded = []; }); st.sel = null; render(); S.toast('New flow. Click the map to place stage 1.'); };
document.getElementById('undo').onclick = undo;
document.getElementById('shuffle').onclick = () => edit('shuffle picks', f => (f.seed = (f.seed || 1) + 1));
document.getElementById('redo').onclick = redo;
let sliderBefore = null;
for (const [id, key, parse] of [['radius', 'radius', parseFloat], ['len', 'length', parseInt]]) {
  const el = document.getElementById(id);
  el.addEventListener('pointerdown', () => (sliderBefore = JSON.stringify(st.flow)));
  el.addEventListener('input', () => { st.flow[key] = parse(el.value); render(); });
  el.addEventListener('change', () => {
    if (sliderBefore && sliderBefore !== JSON.stringify(st.flow)) { undoStack.push({ label: `change ${key}`, flow: sliderBefore }); redoStack.length = 0; renderBar(); }
    sliderBefore = null;
  });
}
document.getElementById('save').onclick = () => { if (!st.res.picks.length) return; const n = prompt('Playlist name', 'Flow ' + new Date().toLocaleDateString()); if (n) S.toast(`Saved “${n}” · ${st.res.picks.length} tracks → rekordbox export`); };

const playFrom = j => S.player.play(j, { queue: st.res.picks.map(p => p.j), label: 'Flow' });
document.getElementById('bottom').addEventListener('click', e => {
  const del = e.target.closest('[data-del]'); if (del) { const k = +del.dataset.del; edit('delete stage', f => f.stages.splice(k, 1)); return; }
  const stg = e.target.closest('[data-stage]'); if (stg) { st.sel = +stg.dataset.stage === st.sel ? null : +stg.dataset.stage; render(); return; }
  const x = e.target.closest('[data-x]'); if (x) { const j = +x.dataset.x; edit('remove track', f => f.excluded.push(j)); return; }
  if (e.target.id === 'playFlow') { playFrom(st.res.picks[0].j); return; }
  const r = e.target.closest('[data-i]'); if (r) playFrom(+r.dataset.i);
});
document.getElementById('bottom').addEventListener('mouseover', e => { const r = e.target.closest('[data-i]'); ringPicks(r ? +r.dataset.i : null); });
document.getElementById('bottom').addEventListener('mouseleave', () => ringPicks());
S.player.onChange(() => renderBottom());

document.addEventListener('keydown', e => {
  if (e.target.closest('input, select, textarea')) return;
  const mod = e.metaKey || e.ctrlKey;
  if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
  if ((e.key === 'Backspace' || e.key === 'Delete') && st.sel != null) { e.preventDefault(); const k = st.sel; st.sel = null; edit('delete stage', f => f.stages.splice(k, 1)); }
  if (e.key === 'Escape' && st.sel != null) { st.sel = null; render(); }
});

document.getElementById('space').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  st.space = b.dataset.v; document.querySelectorAll('#space button').forEach(x => x.classList.toggle('on', x === b));
  S.setSpace(map, st.space); render();
};

// ---- ⌘K palette: pick a result to add it as the next stage ----
const pal = document.getElementById('pal'), pq = document.getElementById('pq'), pres = document.getElementById('pres');
const openPal = () => { pal.classList.add('on'); pq.value = ''; pres.innerHTML = '<div class="muted small" style="padding:8px">Type and press Enter. Click a result to add it as the next stage; ▶ previews it.</div>'; pq.focus(); };
document.getElementById('openPal').onclick = openPal;
document.addEventListener('keydown', e => { if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); openPal(); } if (e.key === 'Escape') pal.classList.remove('on'); });
pal.addEventListener('click', e => { if (e.target === pal) pal.classList.remove('on'); });
pq.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  pres.innerHTML = S.search(pq.value, 25).map(r => { const t = S.tracks[r.i]; return `<div class="row" data-i="${r.i}"><button data-prev="${r.i}" title="Preview">▶</button><span class="dot" style="--c:${S.PALETTE[t.cluster]}"></span><span class="grow">${S.esc(t.title)} <span class="muted">· ${S.esc(t.artist)}</span></span><span class="mono small">${t.bpm}</span></div>`; }).join('');
});
pres.addEventListener('click', e => {
  const pv = e.target.closest('[data-prev]'); if (pv) { S.player.play(+pv.dataset.prev, { label: 'Search preview' }); return; }
  const r = e.target.closest('.row[data-i]'); if (!r) return;
  const j = +r.dataset.i, L = S.layout(st.space);
  pal.classList.remove('on');
  edit('add stage', f => f.stages.push(j));
  Plotly.relayout(map, { 'xaxis.range': [L.x[j] - 6, L.x[j] + 6], 'yaxis.range': [L.y[j] - 6, L.y[j] + 6] });
});
</script>
</body>
